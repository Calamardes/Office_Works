<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: app móvil de una columna, barra de pestañas fija abajo, tarjetas solo para bloques que se operan */
:root{
  --bg:#f3f4f6; --surface:#ffffff; --sunk:#e9ebef; --line:#d6d9e0;
  --fg:#1c222c; --fg2:#4a5260; --muted:#7a8290;
  --accent:#b0592e; --accent-ink:#ffffff; --accent-soft:#f5e4da;
  --s1:#b0592e; --s2:#3a6ea5;
  --ok:#2f7d4f; --ok-bg:#dcefe2; --warn:#9a6a00; --warn-bg:#f6ebcc; --bad:#b3362f; --bad-bg:#f6dcda;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#14171c; --surface:#1d2128; --sunk:#262b33; --line:#343a44;
  --fg:#eceef2; --fg2:#b4bac5; --muted:#868e9b;
  --accent:#d27a4a; --accent-ink:#14171c; --accent-soft:#3a2a22;
  --s1:#d27a4a; --s2:#5b8fd0;
  --ok:#6cc08b; --ok-bg:#1f3428; --warn:#e0b44c; --warn-bg:#382f17; --bad:#ec7a72; --bad-bg:#3d2221;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14171c; --surface:#1d2128; --sunk:#262b33; --line:#343a44;
  --fg:#eceef2; --fg2:#b4bac5; --muted:#868e9b;
  --accent:#d27a4a; --accent-ink:#14171c; --accent-soft:#3a2a22;
  --s1:#d27a4a; --s2:#5b8fd0;
  --ok:#6cc08b; --ok-bg:#1f3428; --warn:#e0b44c; --warn-bg:#382f17; --bad:#ec7a72; --bad-bg:#3d2221;
  color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:8px 104px;display:flex;flex-direction:column;gap:14px}
h1,h2,h3{font-family:var(--f-display);font-weight:600;letter-spacing:.01em;margin:0;text-wrap:balance}
h2{font-size:22px} h3{font-size:18px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:13px} .fg2{color:var(--fg2)}
.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}

/* Cabecera */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:8px 6px;display:flex;flex-direction:column;gap:6px}
.toprow{display:flex;align-items:center;justify-content:space-between;gap:8px}
.brand{font-family:var(--f-display);font-size:20px;font-weight:700;letter-spacing:.02em}
.brand span{color:var(--accent)}
.datenav{display:flex;align-items:center;gap:4px}
.datenav button{width:36px;height:36px}
.datelbl{font-family:var(--f-display);font-size:19px;font-weight:600;min-width:118px;text-align:center}
.sync{font-size:12px;display:flex;align-items:center;gap:6px;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.dot.ok{background:var(--ok)} .dot.warn{background:var(--warn)} .dot.bad{background:var(--bad)}

/* Tarjetas */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.sect{display:flex;flex-direction:column;gap:10px}

/* Controles */
button{font:inherit;color:inherit;border:1px solid var(--line);background:var(--surface);border-radius:8px;min-height:40px;padding:0 12px;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
button.ghost{background:transparent}
button.sm{min-height:32px;padding:0 10px;font-size:13px}
button:disabled{opacity:.5;cursor:default}
input,select,textarea{font:inherit;color:var(--fg);background:var(--sunk);border:1px solid var(--line);border-radius:8px;min-height:42px;padding:0 10px;width:100%;min-width:0}
textarea{padding:10px;min-height:90px;font-family:var(--f-mono);font-size:12px}
input.big{font-family:var(--f-mono);font-size:24px;min-height:52px;text-align:center}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:12px;color:var(--fg2)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row>.grow{flex:1;min-width:0}
.seg{display:flex;gap:4px;overflow-x:auto;padding-bottom:2px}
.seg button{flex:none;min-height:36px;border-radius:18px;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:42px;padding:0 12px;border:1px solid var(--line);border-radius:8px;background:var(--sunk)}
.toggle input{width:22px;height:22px;min-height:0;accent-color:var(--accent)}

/* Semáforo y barras */
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;border-radius:12px;padding:2px 8px;white-space:nowrap}
.pill.VERDE{background:var(--ok-bg);color:var(--ok)} .pill.AMBAR{background:var(--warn-bg);color:var(--warn)} .pill.ROJO{background:var(--bad-bg);color:var(--bad)} .pill.NA{background:var(--sunk);color:var(--muted)}
.macro{display:grid;grid-template-columns:86px 1fr auto;gap:4px 10px;align-items:center}
.macro .name{font-weight:600}
.bar{height:8px;border-radius:4px;background:var(--sunk);position:relative;overflow:hidden;grid-column:1/-1}
.bar i{position:absolute;inset:0 auto 0 0;border-radius:4px}
.bar i.VERDE{background:var(--ok)} .bar i.AMBAR{background:var(--warn)} .bar i.ROJO{background:var(--bad)} .bar i.NA{background:var(--muted)}
.bar b{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--fg2)}
.left{font-size:13px;color:var(--fg2);grid-column:1/-1}
.hero{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.hero .n{font-family:var(--f-display);font-size:44px;font-weight:700;line-height:1}

/* Listas */
.list{display:flex;flex-direction:column}
.li{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.li .grow{flex:1;min-width:0}
.li .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.x{width:32px;min-height:32px;padding:0;border-color:transparent;background:transparent;color:var(--muted);font-size:18px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-height:38px;border-radius:19px;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.tag{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--warn);font-weight:600}
.alert{border-left:3px solid var(--warn);background:var(--warn-bg);border-radius:6px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.alert.info{border-color:var(--s2);background:var(--sunk)}
.alert.bad{border-color:var(--bad);background:var(--bad-bg)}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.kpi{background:var(--sunk);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi .v{font-family:var(--f-display);font-size:26px;font-weight:600;line-height:1.1}
.tbl{overflow-x:auto}
.tbl table{border-collapse:collapse;width:100%;font-size:13px}
.tbl th,.tbl td{text-align:right;padding:6px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl th{font-weight:600;color:var(--fg2);font-size:12px}
.tbl input{min-height:34px;padding:0 6px;font-size:13px;width:70px;text-align:right}
.tbl td.nm input{width:150px;text-align:left}
details>summary{cursor:pointer;font-family:var(--f-display);font-size:18px;font-weight:600;list-style:none;display:flex;justify-content:space-between;align-items:center}
details>summary::after{content:"+";color:var(--muted);font-size:22px}
details[open]>summary::after{content:"–"}
details>summary::-webkit-details-marker{display:none}

/* Gráficos */
.chart{position:relative;width:100%}
.chart svg{display:block;width:100%;overflow:visible}
.chart text{fill:var(--muted);font-family:var(--f-mono);font-size:10px}
.readout{font-size:13px;color:var(--fg2);min-height:20px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--fg2)}
.legend i{display:inline-block;width:12px;height:3px;border-radius:2px;vertical-align:middle;margin-right:6px}
.legend i.dotk{width:8px;height:8px;border-radius:50%}

/* Barra de pestañas */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs button{border:0;border-radius:0;background:transparent;min-height:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;color:var(--muted)}
nav.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}
nav.tabs button[aria-current="page"]{color:var(--accent);font-weight:600}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(70px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);border-radius:8px;padding:10px 14px;display:flex;gap:12px;align-items:center;z-index:20;font-size:14px;max-width:calc(100% - 32px)}
.toast button{min-height:30px;background:transparent;color:var(--bg);border-color:var(--bg)}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .3s ease}}
</style>

<script>
/* =====================================================================
   Recomposición 7x7 — registro personal
   Datos: cuenta claude.ai (capacidad db, subárbol privado del usuario)
   + copia en el teléfono (localStorage) como respaldo y cola sin señal.
   ===================================================================== */

// ---------- Utilidades de fecha (siempre fecha local) ----------
const pad = n => String(n).padStart(2,'0');
const ymd = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parseYmd = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const addDays = (s, n) => { const d = parseYmd(s); d.setDate(d.getDate()+n); return ymd(d); };
const diffDays = (a, b) => Math.round((parseYmd(a) - parseYmd(b)) / 864e5);
const todayStr = () => ymd(new Date());
const DOW = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
const MON = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const fmtDate = s => { const d = parseYmd(s); return DOW[d.getDay()]+' '+d.getDate()+' '+MON[d.getMonth()]; };
const fmtShort = s => { const d = parseYmd(s); return d.getDate()+' '+MON[d.getMonth()]; };
const mondayOf = s => { const d = parseYmd(s); const w = (d.getDay()+6)%7; d.setDate(d.getDate()-w); return ymd(d); };

// ---------- Números (acepta coma decimal) ----------
const num = v => { if (v === null || v === undefined) return null; const s = String(v).trim().replace(',', '.'); if (s === '') return null; const n = Number(s); return isFinite(n) ? n : null; };
const fmt = (n, d=0) => n === null || n === undefined || !isFinite(n) ? '—' : n.toLocaleString('es-CL', {minimumFractionDigits:d, maximumFractionDigits:d});
const sgn = (n, d=2) => n === null || !isFinite(n) ? '—' : (n > 0 ? '+' : n < 0 ? '−' : '±') + fmt(Math.abs(n), d);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = p => p + '-' + Date.now().toString(36) + Math.random().toString(36).slice(2,6);

// ---------- Estado por defecto ----------
// Valores de alimentos: referencia genérica por 100 g. Marcados "confirmar"
// hasta que el usuario los revise con la etiqueta de su producto.
const DEFAULT_FOODS = [
  {id:'A-001', nombre:'Huevo entero', kcal:143, p:12.6, f:9.5, c:0.7, porNom:'unidad', porG:50, fav:true, ref:true},
  {id:'A-002', nombre:'Atún en agua (drenado)', kcal:116, p:25.5, f:0.8, c:0, porNom:'lata drenada', porG:120, fav:true, ref:true},
  {id:'A-003', nombre:'Arroz blanco cocido', kcal:130, p:2.7, f:0.3, c:28.2, porNom:'', porG:null, fav:true, ref:true},
  {id:'A-004', nombre:'Arroz blanco crudo', kcal:365, p:7.1, f:0.7, c:80, porNom:'', porG:null, fav:false, ref:true},
  {id:'A-005', nombre:'Pasta cocida', kcal:158, p:5.8, f:0.9, c:30.9, porNom:'', porG:null, fav:true, ref:true},
  {id:'A-006', nombre:'Pasta cruda', kcal:371, p:13, f:1.5, c:75, porNom:'', porG:null, fav:false, ref:true},
  {id:'A-007', nombre:'Leche descremada', kcal:34, p:3.4, f:0.1, c:5, porNom:'taza 200 ml', porG:200, fav:true, ref:true},
  {id:'A-008', nombre:'Leche entera', kcal:61, p:3.2, f:3.3, c:4.8, porNom:'taza 200 ml', porG:200, fav:false, ref:true},
  {id:'A-009', nombre:'Plátano', kcal:89, p:1.1, f:0.3, c:22.8, porNom:'unidad', porG:120, fav:true, ref:true},
  {id:'A-010', nombre:'Palta Hass', kcal:167, p:2, f:15.4, c:8.6, porNom:'', porG:null, fav:true, ref:true},
  {id:'A-011', nombre:'Yogur natural', kcal:61, p:3.5, f:3.3, c:4.7, porNom:'pote', porG:125, fav:true, ref:true},
  {id:'A-012', nombre:'Queso gauda', kcal:356, p:24.9, f:27.4, c:2.2, porNom:'lámina', porG:20, fav:true, ref:true},
  {id:'A-013', nombre:'Naranja', kcal:47, p:0.9, f:0.1, c:11.8, porNom:'unidad', porG:150, fav:true, ref:true},
  {id:'A-014', nombre:'Whey ON Gold Standard', kcal:395, p:79, f:4.9, c:9.9, porNom:'scoop', porG:30.4, fav:true, ref:true}
];
function defaultState(){
  const t = todayStr();
  return {
    cfg: {altura:177, inicio:t, ciclo:'', drive:'', aguaMeta:null, suenoMeta:null, pasosMeta:8000, minPes:4, piso:1800, paso:150},
    foods: {items: DEFAULT_FOODS.map(f => ({...f}))},
    goals: {items: [{id:'M-0001', desde:t, kcal:2100, p:170, f:65, c:210, origen:'Inicial'}]},
    meas: {items: []}, train: {items: []}, adj: {items: []}, photos: {items: []},
    days: {}
  };
}

// ---------- Persistencia ----------
const LS = 'recomp7x7.v1';
let S = defaultState();
let dirty = new Set();          // ids de documentos con cambios sin enviar
let DB = null, COL = null, dbMode = 'local'; // 'local' | 'cuenta' | 'sin-acceso'
let serverSeen = false;

function lsLoad(){
  try { const raw = localStorage.getItem(LS); if (!raw) return false;
    const o = JSON.parse(raw); if (o && o.S) { S = Object.assign(defaultState(), o.S); dirty = new Set(o.dirty || []); return true; } } catch(e) {}
  return false;
}
function lsSave(){ try { localStorage.setItem(LS, JSON.stringify({S, dirty:[...dirty]})); } catch(e) {} }

const DOC_KEYS = ['cfg','foods','goals','meas','train','adj','photos'];
function docBody(id){ if (id.startsWith('d_')) return S.days[id.slice(2)] || {}; return S[id]; }
function markDirty(id){ dirty.add(id); lsSave(); updateSync(); scheduleFlush(); }
const touchDay = d => markDirty('d_' + d);

let flushing = false, flushTimer = null;
function scheduleFlush(){ clearTimeout(flushTimer); flushTimer = setTimeout(flush, 500); }
async function flush(){
  if (!COL || flushing || !dirty.size) return;
  if (navigator.onLine === false) { updateSync(); return; }
  flushing = true;
  try {
    for (const id of [...dirty]) {
      const body = JSON.parse(JSON.stringify(docBody(id) || {}));
      body._t = Date.now();
      try { await COL.doc(id).set(body); dirty.delete(id); lsSave(); }
      catch(e) {
        if (e && (e.code === 'revoked' || e.code === 'not_granted')) { dbMode = 'sin-acceso'; COL = null; }
        break;
      }
    }
  } finally { flushing = false; updateSync(); if (dirty.size && COL) setTimeout(flush, 15000); }
}
window.addEventListener('online', () => { updateSync(); flush(); });
window.addEventListener('offline', updateSync);

function applyServer(snap){
  if (!serverSeen) {
    if (snap.empty && snap.metadata.fromCache) return; // espera la respuesta real del servidor
    serverSeen = true;
    if (snap.empty) { // primera vez: sube lo que hay en el teléfono
      DOC_KEYS.forEach(k => dirty.add(k));
      Object.keys(S.days).forEach(d => dirty.add('d_' + d));
      lsSave(); scheduleFlush(); render(); return;
    }
  }
  let changed = false;
  snap.docs.forEach(doc => {
    const id = doc.id; if (dirty.has(id) || doc.metadata.hasPendingWrites) return;
    const data = doc.data(); if (!data) return;
    const body = JSON.parse(JSON.stringify(data)); delete body._t;
    if (id.startsWith('d_')) S.days[id.slice(2)] = body;
    else if (DOC_KEYS.includes(id)) S[id] = Object.assign(defaultState()[id], body);
    changed = true;
  });
  if (changed) { lsSave(); render(); }
}

async function connect(){
  if (!window.claude || !window.claude.use) { dbMode = 'local'; updateSync(); return; }
  try {
    const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
    const id = user ? await user.id() : null;
    if (!db || !id) { dbMode = 'local'; updateSync(); return; }
    DB = db; COL = db.collection('data/users/' + id); dbMode = 'cuenta';
    COL.onSnapshot(applyServer, () => { dbMode = 'local'; COL = null; updateSync(); });
    updateSync(); flush();
  } catch(e) { dbMode = 'local'; updateSync(); }
}

function updateSync(){
  const dot = document.getElementById('syncdot'), txt = document.getElementById('synctxt');
  const off = navigator.onLine === false;
  if (dbMode === 'cuenta' && !dirty.size) { dot.className = 'dot ok'; txt.textContent = 'Guardado en tu cuenta'; }
  else if (dbMode === 'cuenta') { dot.className = 'dot warn'; txt.textContent = (off ? 'Sin señal · ' : '') + dirty.size + ' por enviar'; }
  else if (dbMode === 'sin-acceso') { dot.className = 'dot bad'; txt.textContent = 'Solo en este teléfono'; }
  else { dot.className = 'dot warn'; txt.textContent = 'Solo en este teléfono'; }
}

// ---------- Cálculos de negocio ----------
function day(d){ return S.days[d] || null; }
function ensureDay(d){ if (!S.days[d]) S.days[d] = {fecha:d, peso:null, cond:'ayunas', meals:[], hab:{}}; const o = S.days[d]; o.meals = o.meals || []; o.hab = o.hab || {}; return o; }
function goalOn(d){
  const g = [...S.goals.items].filter(x => x.desde <= d).sort((a,b) => a.desde < b.desde ? -1 : a.desde > b.desde ? 1 : 0);
  return g.length ? g[g.length-1] : [...S.goals.items].sort((a,b)=>a.desde<b.desde?-1:1)[0];
}
function jornada(d){
  const h = day(d)?.hab?.jornada; if (h) return h;
  const c = S.cfg.ciclo; if (!c) return null;
  const k = ((diffDays(d, c) % 14) + 14) % 14; return k < 7 ? 'Turno' : 'Descanso';
}
function weightOf(d){ const o = day(d); return o && o.peso != null && o.cond !== 'no' ? o.peso : null; }
function prom7(d){
  const v = []; for (let i = 0; i < 7; i++) { const w = weightOf(addDays(d, -i)); if (w != null) v.push(w); }
  return v.length >= (S.cfg.minPes || 4) ? v.reduce((a,b)=>a+b,0)/v.length : null;
}
function trend7(d){ const a = prom7(d), b = prom7(addDays(d,-7)); return a != null && b != null ? a - b : null; }
function totals(d){
  const t = {kcal:0,p:0,f:0,c:0}; (day(d)?.meals || []).forEach(m => { t.kcal += m.kcal||0; t.p += m.p||0; t.f += m.f||0; t.c += m.c||0; }); return t;
}
// Semáforo: kcal ±5/±10 %, proteína ≥95/≥85 %, grasa y carbohidratos ±10/±20 %
function light(kind, val, meta){
  if (!meta) return 'NA';
  const r = val / meta;
  if (kind === 'p') return r >= .95 ? 'VERDE' : r >= .85 ? 'AMBAR' : 'ROJO';
  const [g, a] = kind === 'kcal' ? [.05, .10] : [.10, .20];
  const dv = Math.abs(r - 1); return dv <= g ? 'VERDE' : dv <= a ? 'AMBAR' : 'ROJO';
}
const LIGHT_TXT = {VERDE:'En meta', AMBAR:'Cerca', ROJO:'Fuera', NA:'—'};
function stepsLight(n){ if (n == null) return 'NA'; const m = S.cfg.pasosMeta || 8000; return n >= m ? 'VERDE' : n >= m*0.75 ? 'AMBAR' : 'ROJO'; }

// Fórmula US Navy, hombres, en cm
function navy(cintura, cuello, altura){
  if (!cintura || !cuello || !altura || cintura <= cuello) return null;
  return 495 / (1.0324 - 0.19077*Math.log10(cintura - cuello) + 0.15456*Math.log10(altura)) - 450;
}
// Pendiente por regresión lineal en kg/semana
function slope(from, to){
  const xs = [], ys = []; for (let d = from; d <= to; d = addDays(d,1)) { const w = weightOf(d); if (w != null) { xs.push(diffDays(d, from)); ys.push(w); } }
  if (xs.length < (S.cfg.minPes || 4)) return {s:null, n:xs.length};
  const mx = xs.reduce((a,b)=>a+b,0)/xs.length, my = ys.reduce((a,b)=>a+b,0)/ys.length;
  let nu = 0, de = 0; xs.forEach((x,i) => { nu += (x-mx)*(ys[i]-my); de += (x-mx)**2; });
  return {s: de ? nu/de*7 : 0, n: xs.length};
}
// Evaluación cada 14 días desde la fecha de inicio
function nextEvalDate(){
  const st = S.cfg.inicio; if (!st) return null;
  const k = Math.max(1, Math.floor(diffDays(todayStr(), st)/14) + 1); return addDays(st, 14*k);
}
function runEvaluation(){
  const st = S.cfg.inicio; if (!st) return;
  const k = Math.floor(diffDays(todayStr(), st)/14); if (k < 1) return;
  const E = addDays(st, 14*k);
  if (S.adj.items.some(a => a.evalDate === E)) return;
  const A = addDays(E,-14), M = addDays(E,-7), Z = addDays(E,-1);
  const w1 = slope(A, addDays(E,-8)), w2 = slope(M, Z), all = slope(A, Z);
  const g = goalOn(Z);
  const it = {id:'AJ-'+pad(S.adj.items.length+1), evalDate:E, desde:A, hasta:Z, s1:w1.s, s2:w2.s, tend:all.s, n:all.n,
    kcalActual:g.kcal, kcalProp:g.kcal, dC:0, dF:0, bajoPiso:false, estado:'Informativa', regla:'', resp:null};
  const paso = S.cfg.paso || 150;
  if (w1.s == null || w2.s == null) { it.regla = 'SIN_DATOS'; }
  else if (all.s < -1.0) { it.regla = 'SUBIR'; it.dC = Math.round(paso/4); }
  else if (w1.s > -0.25 && w2.s > -0.25) {
    it.regla = 'BAJAR';
    // Nunca desde proteína. Propuesta: −25 g carbo y −5 g grasa; si la grasa quedaría bajo 50 g, todo desde carbo.
    if (g.f - 5 >= 50) { it.dC = -25; it.dF = -5; } else { it.dC = -Math.round(paso/4); }
  }
  else if (all.s >= -0.7 && all.s <= -0.5) it.regla = 'MANTENER';
  else it.regla = 'MANTENER_ZONA';
  if (it.regla === 'SUBIR' || it.regla === 'BAJAR') {
    it.kcalProp = g.kcal + (it.regla === 'SUBIR' ? paso : -paso);
    it.bajoPiso = it.kcalProp < (S.cfg.piso || 1800);
    it.estado = 'Pendiente';
  }
  S.adj.items.push(it); markDirty('adj');
}
const REGLA_TXT = {
  SIN_DATOS:'Faltan pesajes para evaluar (mín. ' + 4 + ' por semana). Meta sin cambios.',
  SUBIR:'Bajas más de 1 kg/semana: se propone subir calorías para cuidar el músculo.',
  BAJAR:'Bajas menos de 0,25 kg/semana dos semanas seguidas: se propone bajar calorías (sin tocar proteína).',
  MANTENER:'Bajas entre 0,5 y 0,7 kg/semana: ritmo ideal, se mantiene la meta.',
  MANTENER_ZONA:'Ritmo fuera del rango ideal pero sin regla de ajuste: se mantiene y se reevalúa en 14 días.'
};

// Progresión de un ejercicio vs su sesión anterior
const e1rm = (kg, reps) => kg * (1 + reps/30);
function prevExercise(name, beforeDate, excludeId){
  const n = name.trim().toLowerCase(); if (!n) return null;
  const ss = S.train.items.filter(s => s.id !== excludeId && s.fecha <= beforeDate).sort((a,b) => a.fecha < b.fecha ? 1 : a.fecha > b.fecha ? -1 : (b._ts||0)-(a._ts||0));
  for (const s of ss) { const e = s.ex.find(x => x.n.trim().toLowerCase() === n); if (e) return {...e, fecha:s.fecha}; }
  return null;
}
function progression(e, prev){
  if (!prev) return {k:'Nuevo', sym:'•'};
  const kg = e.kg||0, r = e.r||0, pk = prev.kg||0, pr = prev.r||0;
  if (kg === pk) return r > pr ? {k:'Sube', sym:'↑'} : r === pr ? {k:'Igual', sym:'='} : {k:'Baja', sym:'↓'};
  if (kg > pk && r >= pr) return {k:'Sube', sym:'↑'};
  if (kg < pk && r <= pr) return {k:'Baja', sym:'↓'};
  const a = e1rm(kg, r), b = e1rm(pk, pr);
  return a > b*1.01 ? {k:'Sube', sym:'↑'} : a < b*0.99 ? {k:'Baja', sym:'↓'} : {k:'Igual', sym:'='};
}

    <div class="bar"><i class="${L}" style="width:${pct}%"></i><b style="left:${mark}%"></b></div><span class="left">${left}</span></div>`;
}

function weeks(n){
  const out = [], m0 = mondayOf(todayStr());
  for (let k = n-1; k >= 0; k--) {
    const ws = addDays(m0, -7*k); let reg = 0, kg = 0, pg = 0;
    for (let i = 0; i < 7; i++) { const d = addDays(ws, i); if (d > todayStr()) break; const o = day(d); if (!o || !o.meals?.length) continue;
      reg++; const t = totals(d), g = goalOn(d); if (light('kcal', t.kcal, g.kcal) === 'VERDE') kg++; if (light('p', t.p, g.p) === 'VERDE') pg++; }
    out.push({ws, n:reg, k: reg ? kg/reg : 0, p: reg ? pg/reg : 0});
  }
  return out;
}

// ---------- Gráficos SVG ----------
function lineChart(el, ro, xs, series, yf, dec){
  const W = Math.max(280, el.clientWidth || 320), H = 190, L = 40, R = 10, Tp = 10, B = 24;
  const all = series.flatMap(s => s.pts.map(p => p.y));
  if (!all.length) { el.innerHTML = `<svg viewBox="0 0 ${W} 60" height="60"><text x="${W/2}" y="34" text-anchor="middle">Sin datos en el período</text></svg>`; return; }
  let lo = Math.min(...all), hi = Math.max(...all); const padv = Math.max((hi-lo)*0.15, 0.5); lo -= padv; hi += padv;
  const step = niceStep((hi-lo)/4); lo = Math.floor(lo/step)*step; hi = Math.ceil(hi/step)*step;
  const n = Math.max(xs.length-1, 1);
  const X = i => L + (W-L-R) * (xs.length === 1 ? 0.5 : i/n), Y = v => Tp + (H-Tp-B) * (1 - (v-lo)/(hi-lo));
  let g = '';
  for (let v = lo; v <= hi + 1e-9; v += step) g += `<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${Y(v)+3}" text-anchor="end">${fmt(v, step < 1 ? 1 : 0)}</text>`;
  const lbls = [0, Math.floor(n/2), xs.length-1].filter((v,i,a) => a.indexOf(v) === i);
  lbls.forEach((i, k) => g += `<text x="${X(i)}" y="${H-6}" text-anchor="${k===0?'start':k===lbls.length-1?'end':'middle'}">${fmtShort(xs[i])}</text>`);
  series.forEach(s => {
    if (s.kind === 'dot') s.pts.forEach(p => g += `<circle cx="${X(p.i)}" cy="${Y(p.y)}" r="3.5" fill="${s.color}" fill-opacity=".7"/>`);
    else if (s.pts.length) {
      g += `<path d="${s.pts.map((p,k) => (k ? 'L' : 'M') + X(p.i).toFixed(1) + ' ' + Y(p.y).toFixed(1)).join(' ')}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
      if (s.markers) s.pts.forEach(p => g += `<circle cx="${X(p.i)}" cy="${Y(p.y)}" r="4" fill="${s.color}" stroke="var(--surface)" stroke-width="2"/>`);
      const e = s.pts[s.pts.length-1]; g += `<circle cx="${X(e.i)}" cy="${Y(e.y)}" r="4.5" fill="${s.color}" stroke="var(--surface)" stroke-width="2"/>`;
    }
  });
  g += `<line class="xh" x1="0" x2="0" y1="${Tp}" y2="${H-B}" stroke="var(--fg2)" stroke-width="1" stroke-dasharray="3 3" visibility="hidden"/>`;
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" height="${H}" role="img" aria-label="Gráfico">${g}<rect x="${L}" y="0" width="${W-L-R}" height="${H}" fill="transparent"/></svg>`;
  const svg = el.querySelector('svg'), xh = svg.querySelector('.xh');
  const pick = ev => {
    const r = svg.getBoundingClientRect(), x = (ev.clientX - r.left) * W / r.width;
    let best = null; series.forEach(s => s.pts.forEach(p => { const dx = Math.abs(X(p.i) - x); if (!best || dx < best.dx) best = {dx, i:p.i}; }));
    if (!best) return;
    xh.setAttribute('x1', X(best.i)); xh.setAttribute('x2', X(best.i)); xh.setAttribute('visibility', 'visible');
    ro.textContent = fmtDate(xs[best.i]) + ' · ' + series.map(s => { const p = s.pts.find(q => q.i === best.i); return s.name + ': ' + (p ? yf(p.y) : '—'); }).join(' · ');
  };
  svg.addEventListener('pointerdown', pick); svg.addEventListener('pointermove', e => { if (e.pointerType === 'mouse' || e.buttons) pick(e); });
}
function niceStep(r){ const p = Math.pow(10, Math.floor(Math.log10(r || 1))), m = r/p; return (m < 1.5 ? 1 : m < 3 ? 2 : m < 7 ? 5 : 10) * p; }
function barChart(el, ro, wk){
  const W = Math.max(280, el.clientWidth || 320), H = 170, L = 34, R = 6, Tp = 8, B = 24;
  const Y = v => Tp + (H-Tp-B) * (1 - v), gw = (W-L-R)/wk.length, bw = Math.min(14, (gw-8)/2);
  let g = '';
  [0, .5, 1].forEach(v => g += `<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${L-6}" y="${Y(v)+3}" text-anchor="end">${v*100}%</text>`);
  wk.forEach((w, i) => {
    const cx = L + gw*i + gw/2;
    if (w.n) [[w.k,'var(--s1)',-1],[w.p,'var(--s2)',1]].forEach(([v,c,s]) => { const h = Math.max(v*(H-Tp-B), 2); const x = s < 0 ? cx - bw - 1 : cx + 1;
      g += `<rect x="${x}" y="${Y(0)-h}" width="${bw}" height="${h}" rx="2" fill="${c}"/>`; });
    else g += `<text x="${cx}" y="${Y(0)-4}" text-anchor="middle">·</text>`;
    if (i % 2 === wk.length % 2 || wk.length <= 4) g += `<text x="${cx}" y="${H-6}" text-anchor="middle">${fmtShort(w.ws)}</text>`;
  });
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" height="${H}" role="img" aria-label="Adherencia semanal">${g}</svg>`;
  el.querySelector('svg').addEventListener('pointerdown', ev => {
    const r = ev.currentTarget.getBoundingClientRect(), x = (ev.clientX - r.left) * W / r.width, i = Math.min(wk.length-1, Math.max(0, Math.floor((x-L)/gw))), w = wk[i];
    ro.textContent = 'Semana del ' + fmtShort(w.ws) + ': ' + (w.n ? `${w.n} días registrados · kcal ${fmt(w.k*100)}% · proteína ${fmt(w.p*100)}%` : 'sin registros');
  });
}
